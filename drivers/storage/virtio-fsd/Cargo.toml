[package]
name = "virtio-fsd"
version = "0.1.0"
edition = "2024"
authors = ["MJ Pooladkhay <mj@pooladkhay.com>"]

[dependencies]
async-lock = "3.4"
bitflags = "2.11"
thiserror = "2.0"
zerocopy = { version = "0.8", features = ["derive"] }
futures = { version = "0.3.28", features = ["executor"] }
fuse-abi = { version = "0.2.0", features = ["linux", "zerocopy", "num_enum"] }

daemon = { path = "../../../daemon" }
virtio-core = { path = "../../virtio-core" }
pcid = { path = "../../pcid" }
common = { path = "../../common" }
scheme-utils = { path = "../../../scheme-utils" }

redox-path = "0.4.1"
log.workspace = true
libredox.workspace = true
redox-scheme = { workspace = true, features = ["std"] }
redox_event.workspace = true
redox_syscall.workspace = true

[features]
default = []
# adds '/scheme/virtio-fsd.<tag>/.lru_evicted' path that
# logs LRU evictions for testing purposes
lru-debug = []
